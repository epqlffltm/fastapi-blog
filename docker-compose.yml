# 로컬 개발·검증용. 배포는 이 파일을 출발점으로 삼되 비밀값 관리는 따로 한다.
#
#   docker compose up -d db redis
#   docker compose run --rm app alembic upgrade head
#   docker compose up -d app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: blog
    volumes:
      - pgdata:/var/lib/postgresql/data
    # app 이 "DB 가 떴다" 가 아니라 "DB 가 접속을 받는다" 를 기다리게 한다.
    # 컨테이너 시작과 접속 가능 시점은 다르다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 호스트 포트를 열지 않는다.
    # app 은 compose 네트워크 안에서 "db" 라는 이름으로 붙으므로 포트 노출이 필요 없고,
    # 열어두면 이미 돌고 있는 로컬 PostgreSQL 과 5432 를 놓고 충돌한다.
    # 호스트의 DB 도구로 붙어봐야 한다면 아래를 켜되 포트를 겹치지 않게 바꾼다
    # ports:
    #   - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    # OTP·레이트리밋·조회수 중복키는 전부 만료가 있는 임시 데이터라
    # 디스크에 남길 이유가 없다. 재시작하면 초기화된다
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # SMTP·쿠키·업로드 설정 등은 .env 에서 읽는다
    env_file:
      - .env
    # env_file 보다 나중에 적용된다.
    # 컨테이너 안에서는 localhost 가 아니라 서비스 이름으로 서로를 찾는다
    environment:
      DATABASE_URL: postgresql+asyncpg://blog:${POSTGRES_PASSWORD:-blog}@db:5432/blog
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 이미지 안이 아니라 볼륨에 둔다. 컨테이너를 갈아끼워도 살아남는다
      - uploads:/app/static/img
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  uploads: