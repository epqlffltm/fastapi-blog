<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>프로필 · blog</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">blog</a>
            <nav></nav>
        </div>
    </header>

    <main class="container">
        <section id="user-profile" hidden>
            <div class="avatar-box">
                <img id="pub-avatar" class="avatar-preview" alt="프로필 이미지">
                <div>
                    <h1 id="pub-nickname"></h1>
                    <p class="profile-actions" id="profile-actions" hidden>
                        <a class="ghost-btn" href="/profile">설정</a>
                    </p>
                </div>
            </div>

            <!-- 소개글 박스 -->
            <div class="bio-box">
                <h3>소개</h3>
                <p class="bio-text" id="pub-bio"></p>
            </div>

            <!-- 글 | 댓글 2단 -->
            <div class="profile-columns">
                <div class="profile-box">
                    <h2>작성한 글</h2>
                    <ul class="post-list" id="pub-posts"></ul>
                    <p class="empty" id="pub-posts-empty" hidden>아직 작성한 글이 없습니다.</p>
                    <nav class="pagination" id="posts-pagination" aria-label="글 페이지"></nav>
                </div>

                <div class="profile-box" id="comments-box" hidden>
                    <h2>작성한 댓글</h2>
                    <ul class="comment-list" id="pub-comments"></ul>
                    <p class="empty" id="pub-comments-empty" hidden>아직 작성한 댓글이 없습니다.</p>
                    <nav class="pagination" id="comments-pagination" aria-label="댓글 페이지"></nav>
                </div>
            </div>
        </section>

        <p class="empty" id="status">불러오는 중…</p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/user.js"></script>
</body>
</html>
